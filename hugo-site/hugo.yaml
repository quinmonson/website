baseURL: "https://quinmonson.github.io/website/"   # MUST end with slash
title: "Quin Monson"
languageCode: en-us
enableRobotsTXT: true
disableKinds: [taxonomy, term]

module:
  hugoVersion:
    min: "0.148.2"
    extended: true
  imports:
    - path: github.com/HugoBlox/hugo-blox-builder/modules/blox-tailwind

outputs:
  home: [HTML, RSS]

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  appearance:
    theme_day: custom
    theme_night: custom
    color: custom
    mode: light
    color_mode: light
    font: native
    font_size: L
  header:
    navbar:
      enable: true
      show_search: true
      logo:
        text: "Quin Monson"
  features:
    search:
      provider: pagefind
  extensions:
    css:
      - css/custom.css
  # GaryKing.org/mysite options (from the owner's information form)
  mysite:
    credit: false      # "Footer credit" box unchecked
    discovery: true    # "Invisible marker" box checked
  owner:
    name: "J. Quin Monson"
    short_name: "Quin Monson"
    initials: "QM"
    title: "Professor of Political Science"
    institution: "Brigham Young University"
    institution_url: "https://politicalscience.byu.edu/directory/quin-monson"
    email: "Quin.Monson@byu.edu"
    scholar: "https://scholar.google.com/citations?user=F66r3ZMAAAAJ&hl=en"
    cv: "files/monson-cv.pdf"

permalinks:
  publication: /publication/:contentbasename/
  talk: /talk/:contentbasename/

menu:
  main:
    - name: Bio & C.V.
      url: /bio/
      weight: 10
    - name: Research
      url: /publication/
      weight: 20
    - name: Presentations
      url: /talk/
      weight: 30
    - name: Media
      url: /media/
      weight: 40
    - name: Contact
      url: /contact/
      weight: 70
